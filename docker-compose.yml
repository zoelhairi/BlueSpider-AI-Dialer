services:
  # Main Vapi Voice AI Platform Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vapi-voice-platform
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - VAPI_API_KEY=${VAPI_API_KEY:-}
      - VAPI_PUBLIC_KEY=${VAPI_PUBLIC_KEY:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - APP_URL=${APP_URL:-http://localhost:3000}
    volumes:
      - vapi_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - vapi-network

  # Optional Local PostgreSQL / Supabase-compatible store for persistent offline execution
  postgres:
    image: postgres:16-alpine
    container_name: vapi-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vapi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vapi_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-vapi_voice_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - vapi-network

volumes:
  vapi_data:
    driver: local
  postgres_data:
    driver: local

networks:
  vapi-network:
    driver: bridge
